<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; height: 200px; background: black; color: white; text-align: center; }
    button { background: #ff008c; border: none; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Email Checker</h1>
  <button id="scan">Scan Email</button>
  <div id="result"></div>
  <script>
    document.getElementById("scan").addEventListener("click", () => {
      chrome.scripting.executeScript({
        target: { tabId: chrome.tabs.TAB_ID_CURRENT },
        function: () => alert("Scanning email...")
      });
    });
  </script>
</body>
</html>
