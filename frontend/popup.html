<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>Piscis Phishing AI</h3>
    <button id="analyzeBtn">Analyze Email</button>

    <div id="status-msg"></div>

    <div id="result-container">
      <!-- 1. Top Status Block -->
      <div id="verdict-banner">SAFE</div>

      <!-- 2. Middle Radial Gauge -->
      <div class="gauge-container">
        <canvas id="gaugeCanvas" width="160" height="160"></canvas>
        <div class="gauge-label">
          <span id="gaugeValue">0</span>%
          <div class="gauge-sub">Confidence</div>
        </div>
      </div>

      <!-- 3. Bottom Dropdown Accordion -->
      <details class="details-dropdown">
        <summary>Analysis Breakdown</summary>
        <div class="dropdown-content">
          <div class="section-title">Explanation</div>
          <div id="explanation"></div>

          <div id="red-flags-section">
            <div class="section-title">Red Flags</div>
            <ul id="red-flags-list"></ul>
          </div>
        </div>
      </details>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
