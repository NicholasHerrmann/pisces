<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>Piscis Phishing AI</h3>
    <button id="analyzeBtn">Analyze Email</button>

    <div id="status-msg"></div>

    <div id="result-container">
      <div id="verdict-banner">SAFE</div>

      <div class="gauge-container">
        <canvas id="gaugeCanvas" width="160" height="160"></canvas>
        <div class="gauge-label">
          <span id="gaugeValue">0</span>%
          <div class="gauge-sub">Confidence</div>
        </div>
      </div>
      <!-- 3. Bottom Dropdown Accordion -->
      <details class="details-dropdown">
        <!-- Added id="dropdown-summary" -->
        <summary id="dropdown-summary">Analysis Breakdown</summary> 
        
        <div class="dropdown-content">
          <!-- Message shown when the email is SAFE -->
          <div id="all-clear-msg" style="display: none; color: #5cb85c; font-weight: 600; padding: 4px 0;">
            ✅ All clear! No threat indicators or suspicious red flags were detected in this email.
          </div>

          <!-- Container for Red Flags / Issues -->
          <div id="red-flags-section">
            <div class="section-title">Red Flags</div>
            <ul id="red-flags-list"></ul>
          </div>

          <div class="section-title">Explanation</div>
          <div id="explanation"></div>
        </div>
      </details>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
